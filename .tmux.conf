# 全般設定 ###############################

# 行数増 2000→10000
set-option -g history-limit 10000

# マウス操作
set-option -g mouse on


# window の番号は 1 から始める
set-option -g base-index 1

# ウィンドウ削除時に番号を詰める
set -g renumber-windows on

# セッション破棄時に前のセッションに自動切替
set -g detach-on-destroy previous

# Prefix キーの遅延 ms
set -sg escape-time 10

# OSC 52 クリップボード統合（pbcopy/clip.exe不要、SSH越しでも動作）
# iTerm2の場合: Preferences > General > Selection > "Applications in terminal may access clipboard" を有効化
set -s set-clipboard external
set -as terminal-features ',xterm-256color:clipboard'

# Synchronized Output（DEC mode 2026）- 画面ちらつき軽減
set -as terminal-features ",xterm-256color:sync"

# 拡張キー（Ctrl+Tab等の修飾キー付き特殊キーを認識）
set -g extended-keys on

# display-panes の表示時間
set -g display-panes-time 2500


# マウス ####################################
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind-key -n WheelDownPane select-pane -t= \; send-keys -M

unbind -T copy-mode-vi MouseDragEnd1Pane

# キーバインド ##############################

# C-q で操作
set -g prefix C-q

# コピー、選択モードのキーバインドvi/emacs
set-window-option -g mode-keys vi

# vでマーク開始
bind -T copy-mode-vi v send -X begin-selection

# yでヤンク（OSC 52経由でシステムクリップボードにコピー）
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel


# 設定の再読み込み
bind C-r source-file ~/.tmux.conf

# Ctr おしっぱなしでコピーモード
bind -r ^[ copy-mode
bind -r ^] paste-buffer

# Ctr おしっぱなしで window 移動
# bind -r C-p previous-window
# bind -r C-n next-window

# shell の履歴と誤爆がおおいので解除
unbind p
unbind n

# window/pane移動を楽に
# bind -n C-t next-window
bind -n C-s next-window
# bind -n C-s display-panes
bind -n C-t select-pane -t :.+

# Ctrl+Tab / Ctrl+Shift+Tab でウィンドウ切り替え
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# byobu 風の F キー利用
bind -n F2 new-window
bind -n F3 previous-window
bind -n F4 next-window

# 分割系は Emacs 風に
unbind 1
bind 1 break-pane
bind 2 split-window -v -c '#{pane_current_path}'
bind 3 split-window -h -c '#{pane_current_path}'
bind k kill-window
unbind &

# 分割後のリサイズ
bind -r C-h resize-pane -L
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R

# pane 移動
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# xmonad 風の window 移動
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# バッファ保存
bind s run "tmux capture-pane -S -10000; tmux show-buffer > ~/tmuxlog-`date '+%Y%m%d_%H%M%S'`.log ; display 'save log ~/tmuxlog-`date '+%Y%m%d_%H%M%S'`.log'"

# 複数のペインに同じコマンドを入力（synchronize-panes toggle）
bind e setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,on,off}"

# セッション管理（fzf popup）
bind-key m display-popup -E -w 80% -h 80% "tmux-session-manager"

# ウィンドウを他セッションに移動（fzf popup）
bind-key M display-popup -E -w 80% -h 80% "tmux-move-window"

# セッション前後切替（Alt+j/k）
bind-key -n M-k switch-client -p \; refresh-client -S
bind-key -n M-j switch-client -n \; refresh-client -S

# ステータスライン ##########################
set -g status-style "fg=white,bg=terminal"

set -g status-left-length 80
set -g status-left '#{?client_prefix,#[fg=red bold] PREFIX ,}#(tmux-status-sessions "#S")#[fg=colour238]| '
set -g status-right '#[fg=colour250]%H:%M '
set -g status-right-length 15


# 表示中のウィンドウ
# setw -g window-status-current-style fg=yellow,bold,bg=black
setw -g window-status-current-style fg=yellow,bold

# それ以外のウィンドウ
# setw -g window-status-style fg=white,bg=black
setw -g window-status-style fg=white

# ステータスバーを更新
set -g status-interval 15

# ステータスラインの表示位置
set -g status-position top

# ステータスラインのウィンドウリスト位置
set -g status-justify left
# set-option -g status-justify "centre"

# ステータスラインの上に空行を入れる
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[1]' ''
set -g status-format[1] '#[fg=white,bg=terminal]'
set -g status 2

# 現在のディレクトリをステータスラインに表示する
set -g window-status-current-format ' #{window_index} #{pane_title}'
set -g window-status-format ' #{window_index} #{pane_title}'

# 他のウィンドウのアクティビティをステータスラインで表示する？
set -g monitor-activity off
# monitor-activity の際にステータスラインへメッセージを表示する？
set -g visual-activity off

# メッセージの表示時間 ms
set -g display-time 2000


# その他色 #############################

# アクティブなペインの背景色を変更する（アプリの色と干渉するためオフ）
# setw -g window-active-style 'bg=#F6F1E9'
# setw -g window-style 'bg=#ede8df'

# コピーモード選択色
set -g mode-style 'reverse'

# メッセージ色
set-option -g message-style bg=black,fg=red

# display-panes の色
set -g display-panes-colour blue
set -g display-panes-active-colour green

# ペインの境界 ################################

# ボーダーの線種
# set -g pane-border-lines heavy
set -g pane-border-lines single

# アクティブペインの識別: 色のみ（both だと矢印がボーダーを薄く見せる）
set -g pane-border-indicators colour

# ボーダーカラー: 統一色（ペインタイトルの色で識別）
set -g pane-border-style fg=colour243
set -g pane-active-border-style fg=colour243

# ボーダー上部にペインタイトルを表示
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[fg=green#,bold] ▸ #{pane_index}:#{?@pane_label,#{@pane_label},#{pane_title}} #[nobold],#[fg=colour250]  #{pane_index}:#{?@pane_label,#{@pane_label},#{pane_title}} }'

# ペインラベル設定用キーバインド (prefix + T)
bind T command-prompt -p "Pane label:" "set -p @pane_label '%%'"

# 時計色
set-window-option -g clock-mode-colour black

# Screensaver
set -g lock-command "cmatrix -s -b"

# セッション自動作成（存在しない場合のみ）
if-shell "! tmux has-session -t '󰋜 Home' 2>/dev/null" "new-session -d -s '󰋜 Home'"
if-shell "! tmux has-session -t '󰍹 work' 2>/dev/null" "new-session -d -s '󰍹 work'"

